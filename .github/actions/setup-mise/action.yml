name: Setup mise toolchain and caches
description: >
  Bootstraps mise (Python, uv, bun, lefthook) and primes the uv and bun
  caches. Assumes the repo has already been checked out by the caller.

runs:
  using: composite
  steps:
    - uses: jdx/mise-action@v2
      with:
        install: true
        cache: true

    - name: Cache uv
      uses: actions/cache@v4
      with:
        path: ~/.cache/uv
        key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
        restore-keys: |
          uv-${{ runner.os }}-

    - name: Cache bun
      uses: actions/cache@v4
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('frontend/bun.lock') }}
        restore-keys: |
          bun-${{ runner.os }}-

    - name: Bootstrap deps
      shell: bash
      run: |
        mise install
        mise run install

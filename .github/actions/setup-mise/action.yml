name: Setup mise toolchain and caches
description: >
  Bootstraps mise (Python, uv, bun, lefthook) and primes the uv and bun
  caches. Assumes the repo has already been checked out by the caller.

runs:
  using: composite
  steps:
    - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
      with:
        install: true
        cache: true

    - name: Cache uv
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.cache/uv
        key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
        restore-keys: |
          uv-${{ runner.os }}-

    - name: Cache bun
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('frontend/bun.lock') }}
        restore-keys: |
          bun-${{ runner.os }}-

    - name: Bootstrap deps
      shell: bash
      run: |
        mise install
        mise run install

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # A placeholder pull request opens on an empty commit, and an empty commit
  # can land on main: nothing in either needs checking. Path filters would not
  # do, as the tests read docs/ too, and a workflow-level filter would leave
  # the required Lint and Test pending forever. A skipped job counts as passed.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # Compare from the merge base, so a pull request counts only its own
          # commits. A push that opens the branch has no commit before it.
          if [ "$BASE" = 0000000000000000000000000000000000000000 ]; then
            files=1
          else
            files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BASE...$HEAD" --jq '.files | length')
          fi
          echo "changed=$([ "$files" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  # With strict branch protection a squash merge lands the tree its pull
  # request's last run tested, so the push run on main would repeat nine
  # minutes of work. This job skips Lint, Test and Perf only when the script
  # finds a successful pull request run that recorded this exact tree (see
  # `record` below); in any doubt, or if this job fails, they run in full. Its
  # summary is main's record of which run it relied on.
  gate:
    name: Main gate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      skip: ${{ steps.decide.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci_main_gate.py

  lint:
    name: Lint
    needs: [changes, gate]
    # `!cancelled()` so a failed gate runs the checks, not skips them into a pass.
    if: ${{ !cancelled() && needs.changes.outputs.changed != 'false' && needs.gate.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-mise
      # Runs ruff, Biome, both type checkers and the copy check. A step of its own for `tsc`
      # would never go red: this one fails first on the same check.
      - name: Ruff, Biome, the type checkers and jscpd
        run: mise run lint
      - name: Ty (with GitHub annotations)
        run: mise exec -- uv run ty check --output-format github --error-on-warning

  test:
    name: Test
    needs: [changes, gate]
    if: ${{ !cancelled() && needs.changes.outputs.changed != 'false' && needs.gate.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    services:
      # Mirrors compose.yaml so backend/.env.example resolves without overrides.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kasten
          POSTGRES_PASSWORD: kasten
          POSTGRES_DB: kasten_dev
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U kasten -d kasten_dev"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-mise
      # Proves the Alembic wiring against a real database, which the unit
      # tests deliberately do not touch.
      - name: Apply migrations
        run: mise run db:migrate
      - name: Backend tests
        run: mise run test:py
      - name: Frontend tests
        run: mise run fe:test
      - name: Chat runner tests
        run: mise run shell:test

  perf:
    name: Perf
    needs: [changes, gate]
    if: ${{ !cancelled() && needs.changes.outputs.changed != 'false' && needs.gate.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    # No Postgres service: the frame gate mounts React over a synthetic vault
    # and never reaches the backend, let alone the database.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-mise
      # setup-mise runs `mise run install`, which puts the playwright CLI in
      # frontend/node_modules, but the browser it drives is a separate download
      # the runner image does not carry. `--with-deps` adds the shared
      # libraries Chromium needs, which a bare runner is also missing.
      - name: Install Chromium
        run: frontend/node_modules/.bin/playwright install chromium --with-deps
      - name: Frame gate
        run: mise run fe:frame

  # Names an artifact after the tree this run checked out, once Lint, Test and
  # Perf have all passed, so the gate of the push run on main can find it. The
  # tree, not the commit: the squash commit on main differs from the merge ref
  # tested here, but with strict branch protection its tree is the same.
  record:
    name: Record the tested tree
    needs: [lint, test, perf]
    if: github.event_name == 'pull_request' && needs.lint.result == 'success' && needs.test.result == 'success' && needs.perf.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - id: tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tree=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$GITHUB_SHA" --jq .tree.sha)
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          echo "$GITHUB_SHA" > tested-commit.txt
      - uses: actions/upload-artifact@v7
        with:
          name: ci-tested-tree-${{ steps.tree.outputs.tree }}
          path: tested-commit.txt
          retention-days: 30

name: CI

on:
  # `ready_for_review` beside the defaults, so a draft marked ready gets the
  # reviews it skipped while a draft.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # A placeholder pull request opens on an empty commit, and an empty commit
  # can land on main: nothing in either needs checking. Path filters would not
  # do, as the tests read docs/ too, and a workflow-level filter would leave
  # the required checks pending forever. A skipped job counts as passed.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # Compare from the merge base, so a pull request counts only its own
          # commits. A push that opens the branch has no commit before it.
          if [ "$BASE" = 0000000000000000000000000000000000000000 ]; then
            files=1
          else
            files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BASE...$HEAD" --jq '.files | length')
          fi
          echo "changed=$([ "$files" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  # With strict branch protection a squash merge lands the tree its pull
  # request's last run tested, so the push run on main would repeat nine
  # minutes of work. This job skips Lint, Backend, Test and Perf only when the script
  # finds a successful pull request run that recorded this exact tree (see
  # `record` below); in any doubt, or if this job fails, they run in full. Its
  # summary is main's record of which run it relied on.
  gate:
    name: Main gate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      skip: ${{ steps.decide.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci_main_gate.py

  lint:
    name: Lint
    needs: [changes, gate]
    # `!cancelled()` so a failed gate runs the checks, not skips them into a pass.
    if: ${{ !cancelled() && needs.changes.outputs.changed != 'false' && needs.gate.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-mise
      # Runs ruff, Biome, both type checkers and the copy check. A step of its own for `tsc`
      # would never go red: this one fails first on the same check.
      - name: Ruff, Biome, the type checkers and jscpd
        run: mise run lint
      - name: Ty (with GitHub annotations)
        run: mise exec -- uv run ty check --output-format github --error-on-warning

  # Apart from Test so the two suites run side by side: run one after the other
  # they held Test to eleven minutes.
  backend:
    name: Backend
    needs: [changes, gate]
    if: ${{ !cancelled() && needs.changes.outputs.changed != 'false' && needs.gate.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Not a `services:` container: those take an image from a registry and
      # no build, and this one is built here from deploy/postgres, the file
      # dev uses and prod's copy follows. Port and credentials mirror
      # compose.yaml, so backend/.env.example resolves without overrides.
      # pg_isready over TCP, because the entrypoint's first server, the one
      # that runs the init, listens on the socket only and then stops.
      - name: Start Postgres with pgvector and pg_textsearch
        run: |
          docker build -q -t kasten-postgres deploy/postgres
          docker run -d --name postgres -p 5434:5432 \
            -e POSTGRES_USER=kasten -e POSTGRES_PASSWORD=kasten -e POSTGRES_DB=kasten_dev \
            kasten-postgres
          for _ in $(seq 60); do
            docker exec postgres pg_isready -h 127.0.0.1 -U kasten -d kasten_dev -q && exit 0
            sleep 1
          done
          docker logs postgres
          exit 1
      - uses: ./.github/actions/setup-mise
      # Proves the Alembic wiring against a real database, which the unit
      # tests deliberately do not touch.
      - name: Apply migrations
        run: mise run db:migrate
      - name: Backend tests
        run: mise run test:py

  test:
    name: Test
    needs: [changes, gate]
    if: ${{ !cancelled() && needs.changes.outputs.changed != 'false' && needs.gate.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-mise
      - name: Frontend tests
        run: mise run fe:test
      - name: Chat runner tests
        run: mise run shell:test

  perf:
    name: Perf
    needs: [changes, gate]
    if: ${{ !cancelled() && needs.changes.outputs.changed != 'false' && needs.gate.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    # No Postgres service: the frame gate mounts React over a synthetic vault
    # and never reaches the backend, let alone the database.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-mise
      # setup-mise runs `mise run install`, which puts the playwright CLI in
      # frontend/node_modules, but the browser it drives is a separate download
      # the runner image does not carry. `--with-deps` adds the shared
      # libraries Chromium needs, which a bare runner is also missing.
      - name: Install Chromium
        run: frontend/node_modules/.bin/playwright install chromium --with-deps
      - name: Frame gate
        run: mise run fe:frame

  # Lists the packages this pull request adds to the lockfiles, with licence and
  # latest release, and fails on a licence outside the allowlist. Registry
  # metadata only, so it needs no secrets and runs for forks and Dependabot too.
  # Not behind `changes`: an empty pull request adds no package and passes.
  dependencies:
    name: Dependencies
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The base in a variable of its own, so a failed merge-base stops the step
      # instead of passing an empty base, which git would read as the index.
      - run: |
          set -euo pipefail
          base=$(git merge-base "origin/$GITHUB_BASE_REF" HEAD)
          python3 .github/deps/new_dependencies.py "$base"

  # Names an artifact after the tree this run checked out, once Lint, Backend,
  # Test and Perf have all passed, so the gate of the push run on main can find it. The
  # tree, not the commit: the squash commit on main differs from the merge ref
  # tested here, but with strict branch protection its tree is the same.
  record:
    name: Record the tested tree
    needs: [lint, backend, test, perf]
    # `!cancelled()` in place of the implied `success()`, which would skip this
    # job because the gate upstream is always skipped on a pull request. The
    # four results below are what must hold.
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.lint.result == 'success' && needs.backend.result == 'success' && needs.test.result == 'success' && needs.perf.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - id: tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tree=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$GITHUB_SHA" --jq .tree.sha)
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          echo "$GITHUB_SHA" > tested-commit.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-tested-tree-${{ steps.tree.outputs.tree }}
          path: tested-commit.txt
          retention-days: 30

  # The reviews run on `pull_request`, never `pull_request_target`: a pull
  # request from a fork runs with no secrets and a read-only token, so its code
  # never meets the OAuth token. Anyone may comment on a public pull request, so the reviewer reads no
  # comment straight from GitHub: a step writes it the pull request and the
  # earlier threads by the bot and the owner. It can read files in the checkout,
  # run git, post inline comments and write its summary, nothing more; the steps
  # around it do the rest with the token.
  review:
    name: ${{ matrix.name }}
    # The job always runs and its first step decides, as a matrix job skipped by
    # its `if:` never expands: it reports one check named `${{ matrix.name }}`,
    # and the required Review and Security would wait forever. So a fork or a
    # Dependabot pull request (whose runs see neither the token nor write
    # access), a draft, or a run whose Lint, Backend or Test did not pass passes here
    # with no round; pgoell reads the first two by hand.
    needs: [lint, backend, test]
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: review
            name: Review
          - kind: security
            name: Security
    env:
      KIND: ${{ matrix.kind }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      OWNER: ${{ github.repository_owner }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - id: decide
        env:
          RUN: >-
            ${{ needs.lint.result == 'success' && needs.backend.result == 'success' && needs.test.result == 'success' &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            github.event.pull_request.user.login != 'dependabot[bot]' &&
            !github.event.pull_request.draft }}
        run: |
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          if [ "$RUN" != true ]; then echo "No round: a fork, Dependabot, a draft, or Lint, Backend or Test did not pass." >> "$GITHUB_STEP_SUMMARY"; fi
      - if: steps.decide.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      # The scrub below runs each command in Claude Code's sandbox, which needs
      # bubblewrap and socat, neither on the runner image, and user namespaces,
      # which Ubuntu's AppArmor blocks by default.
      - if: steps.decide.outputs.run == 'true'
        run: |
          sudo apt-get install -y -qq bubblewrap socat
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # Out of the checkout, where the reviewer's git cannot write over it.
      - if: steps.decide.outputs.run == 'true'
        run: cp .github/review/round.sh .github/review/context.sh "$RUNNER_TEMP/"
      - id: base
        if: steps.decide.outputs.run == 'true'
        run: echo "sha=$(git merge-base "origin/$GITHUB_BASE_REF" HEAD)" >> "$GITHUB_OUTPUT"
      - id: round
        if: steps.decide.outputs.run == 'true'
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: bash "$RUNNER_TEMP/round.sh" plan
      - if: steps.round.outputs.stop == 'false'
        run: bash "$RUNNER_TEMP/context.sh"
      - id: prompt
        if: steps.round.outputs.stop == 'false'
        env:
          FROM: ${{ steps.round.outputs.from }}
          ROUND: ${{ steps.round.outputs.round }}
          MAX: ${{ steps.round.outputs.max }}
        run: |
          {
            echo 'text<<PROMPT_END'
            echo "Round $ROUND of $MAX. FROM: $FROM. HEAD: $HEAD_SHA."
            echo
            sed -e "s|{FROM}|$FROM|g" ".github/review/$KIND.md"
            echo 'PROMPT_END'
          } >> "$GITHUB_OUTPUT"
      - if: steps.round.outputs.stop == 'false'
        uses: anthropics/claude-code-action@d70510b174a1244958df0b03166a54912811f3e6 # v1.0.264
        env:
          # Strips the tokens from the environment of every command it runs.
          # Files are another matter: the action writes a token into
          # .git/config, so the reviewer may not read .git.
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: 1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: ${{ steps.prompt.outputs.text }}
          claude_args: >-
            --model claude-opus-5-5
            --disallowedTools "Read(./.git/**)"
            --allowedTools "Read(./**),Write(./.review/summary.md),Edit(./.review/summary.md),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git grep:*),Bash(git ls-files:*),mcp__github_inline_comment__create_inline_comment"
      - if: steps.round.outputs.stop == 'false'
        run: |
          if [ -s .review/summary.md ]; then
            gh pr comment "$PR" --body-file .review/summary.md
          else
            echo "The reviewer wrote no summary." >&2
            exit 1
          fi
      # Only after a review that ran to the end, so a failed run is redone in
      # full by its rerun and not counted as a round.
      - if: steps.round.outputs.rerun == 'false'
        env:
          ROUND: ${{ steps.round.outputs.round }}
          FROM: ${{ steps.round.outputs.from }}
          COMMENT_ID: ${{ steps.round.outputs.comment_id }}
          SKIP: ${{ steps.round.outputs.skip }}
        run: bash "$RUNNER_TEMP/round.sh" record

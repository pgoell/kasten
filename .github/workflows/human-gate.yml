name: Human gate

# `pull_request_target` runs this file and risk-paths from the base branch, so a
# pull request cannot edit the gate to pass itself. It never checks out the
# pull request's code: it only reads the file list and labels through the API.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled]

# No concurrency group: a run cancelled by the next event could skip taking the
# label off after a push. Each run reads the head and labels live.

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/review
      - env:
          PR: ${{ github.event.pull_request.number }}
          EVENT: ${{ github.event.action }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          OWNER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ github.token }}
          # true: a high-risk pull request fails the gate until pgoell approves;
          # false makes the gate report only.
          ENFORCE: true
        run: bash .github/review/gate.sh

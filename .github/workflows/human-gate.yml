name: Human gate

# `pull_request_target` runs this file and risk-paths from the base branch, so a
# pull request cannot edit the gate to pass itself. It never checks out the
# pull request's code: it only reads the file list and labels through the API.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled]

concurrency:
  group: human-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  gate:
    name: Human gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/review
      - env:
          PR: ${{ github.event.pull_request.number }}
          EVENT: ${{ github.event.action }}
          OWNER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ github.token }}
          # false while the pilot runs: the check reports and blocks nothing.
          ENFORCE: false
        run: bash .github/review/gate.sh

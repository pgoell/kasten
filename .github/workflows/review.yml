name: Review

# `pull_request`, never `pull_request_target`: a pull request from a fork runs
# with no secrets and a read-only token, so its code never meets the OAuth
# token. Anyone may comment on a public pull request, so the reviewer reads no
# comment straight from GitHub: a step writes it the pull request and the
# earlier threads by the bot and the owner. It can read files in the checkout,
# run git, post inline comments and write its summary, nothing more; the steps
# around it do the rest with the token.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  review:
    name: ${{ matrix.name }}
    # A skipped job counts as passed, so a fork or a Dependabot pull request
    # (whose runs see neither the token nor write access) does not wait forever
    # on a required check. pgoell reads those by hand.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: review
            name: Review
          - kind: security
            name: Security
    env:
      KIND: ${{ matrix.kind }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      OWNER: ${{ github.repository_owner }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      # Out of the checkout, where the reviewer's git cannot write over it.
      - run: cp .github/review/round.sh .github/review/context.sh "$RUNNER_TEMP/"
      - id: base
        run: echo "sha=$(git merge-base "origin/$GITHUB_BASE_REF" HEAD)" >> "$GITHUB_OUTPUT"
      - id: round
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: bash "$RUNNER_TEMP/round.sh" plan
      - if: steps.round.outputs.stop == 'false'
        run: bash "$RUNNER_TEMP/context.sh"
      - id: prompt
        if: steps.round.outputs.stop == 'false'
        env:
          FROM: ${{ steps.round.outputs.from }}
          ROUND: ${{ steps.round.outputs.round }}
        run: |
          {
            echo 'text<<PROMPT_END'
            echo "Round $ROUND of 3. FROM: $FROM. HEAD: $HEAD_SHA."
            echo
            sed -e "s|{FROM}|$FROM|g" ".github/review/$KIND.md"
            echo 'PROMPT_END'
          } >> "$GITHUB_OUTPUT"
      - if: steps.round.outputs.stop == 'false'
        uses: anthropics/claude-code-action@d70510b174a1244958df0b03166a54912811f3e6 # v1.0.264
        env:
          # Strips the tokens from the environment of every command it runs.
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: 1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: ${{ steps.prompt.outputs.text }}
          claude_args: >-
            --model claude-opus-5-5
            --allowedTools "Read(./**),Write(./.review/summary.md),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git grep:*),Bash(git ls-files:*),mcp__github_inline_comment__create_inline_comment"
      - if: steps.round.outputs.stop == 'false'
        run: |
          if [ -s .review/summary.md ]; then
            gh pr comment "$PR" --body-file .review/summary.md
          else
            echo "The reviewer wrote no summary." >&2
            exit 1
          fi
      # Only after a review that ran to the end, so a failed run is redone in
      # full by its rerun and not counted as a round.
      - env:
          ROUND: ${{ steps.round.outputs.round }}
          FROM: ${{ steps.round.outputs.from }}
          COMMENT_ID: ${{ steps.round.outputs.comment_id }}
        run: bash "$RUNNER_TEMP/round.sh" record

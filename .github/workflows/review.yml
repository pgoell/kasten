name: Review

# `pull_request`, never `pull_request_target`: a pull request from a fork runs
# with no secrets and a read-only token, so its code never meets the OAuth
# token. The reviewer reads untrusted text all the same, so it gets read tools,
# gh commands that comment, and a token scoped to this job's permissions.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  review:
    name: ${{ matrix.name }}
    # A skipped job counts as passed, so a fork or a Dependabot pull request
    # (whose runs see neither the token nor write access) does not wait forever
    # on a required check. pgoell reads those by hand.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: review
            name: Review
          - kind: security
            name: Security
    env:
      KIND: ${{ matrix.kind }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - id: base
        run: echo "sha=$(git merge-base "origin/$GITHUB_BASE_REF" HEAD)" >> "$GITHUB_OUTPUT"
      - id: round
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: bash .github/review/round.sh plan
      - id: prompt
        if: steps.round.outputs.stop == 'false'
        env:
          FROM: ${{ steps.round.outputs.from }}
          ROUND: ${{ steps.round.outputs.round }}
        run: |
          {
            echo 'text<<PROMPT_END'
            echo "REPO: $GITHUB_REPOSITORY. PR: $PR. Round $ROUND of 3. FROM: $FROM. HEAD: $HEAD_SHA."
            echo
            sed -e "s|{FROM}|$FROM|g" -e "s|{REPO}|$GITHUB_REPOSITORY|g" -e "s|{PR}|$PR|g" ".github/review/$KIND.md"
            echo 'PROMPT_END'
          } >> "$GITHUB_OUTPUT"
      - if: steps.round.outputs.stop == 'false'
        uses: anthropics/claude-code-action@d70510b174a1244958df0b03166a54912811f3e6 # v1.0.264
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: ${{ steps.prompt.outputs.text }}
          claude_args: >-
            --model claude-opus-5-5
            --allowedTools "Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh api repos/${{ github.repository }}/pulls/:*),mcp__github_inline_comment__create_inline_comment"
      # Only after a review that ran to the end, so a failed run is redone in
      # full by its rerun and not counted as a round.
      - env:
          ROUND: ${{ steps.round.outputs.round }}
          FROM: ${{ steps.round.outputs.from }}
          COMMENT_ID: ${{ steps.round.outputs.comment_id }}
        run: bash .github/review/round.sh record

name: Deploy production

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing image tag to redeploy (e.g. 1.2.0). Skips the build."
        required: true

# Never cancel a running deploy: a half-applied migration is worse than a queue.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  # Decides once, for all three images, which to build and which to copy, so
  # the build matrix below fans out over the changed ones alone.
  plan:
    name: Plan the images
    # A dispatch redeploys an existing tag, so there is nothing to build.
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history and every tag, which the decision below needs: it
          # diffs this release against the one before it, and neither the tag
          # list nor the range exists in a shallow clone.
          fetch-depth: 0
      # The tag is the version the backend reports, so a malformed one, or one
      # that is not the next patch, minor or major, stops here, before anything
      # is built or pushed. The checkout already has every tag (fetch-depth 0).
      - name: Check the tag is the next release number
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          python3 scripts/check_release_tag.py "$TAG"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # `shell/` had not changed in three releases and was rebuilt for each of
      # them, at four minutes a time on the critical path. An image whose
      # sources are untouched is the image already in the registry, so it is
      # copied here and only the rest go on to be built.
      #
      # The copy happens inside the registry: no pull, no build, no cache
      # export, and the digest the deploy gets is the one that was tested under
      # the earlier tag rather than a fresh build of the same sources. `latest`
      # moves too, because the build path tags both and the deploy has no way
      # to tell which path produced the image it pulls.
      - name: Decide which images to build, and copy the rest
        id: decide
        env:
          TAG: ${{ github.event.release.tag_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          # The release before this one, which is what the tag's parent is
          # described by. Empty on the first release ever, and then everything
          # is built because there is nothing to compare against.
          # Release tags alone, the shape the tag check enforces: another tag in
          # between would name no image to copy.
          previous=$(git describe --tags --abbrev=0 --match '[0-9]*.[0-9]*.[0-9]*' "$TAG^" 2>/dev/null || true)

          build=()
          for component in backend frontend shell; do
            image="ghcr.io/$OWNER/kasten-$component"

            # What goes into each image, as the Dockerfiles copy it. The
            # backend has no entry: it is built on every release, below.
            case "$component" in
              backend) sources="" ;;
              frontend) sources="frontend" ;;
              shell) sources="shell" ;;
            esac

            # The backend is never copied. Its version is written in at build
            # time, so a copy would report the previous tag.
            if [ "$component" = backend ]; then
              reason="its version is the tag, written in at build time"
            elif [ -z "$previous" ]; then
              reason="no earlier release to compare against"
            elif ! git diff --quiet "$previous" "$TAG" -- $sources; then
              reason="$sources changed since $previous"
            elif ! manifest=$(docker buildx imagetools inspect --raw "$image:$previous" 2>/dev/null); then
              # The copy has nothing to copy. Building is slower and always
              # right, and a deploy pulling a tag that was never pushed is the
              # failure this guard exists to prevent.
              reason="no $image:$previous in the registry to copy"
            elif ! jq -e '[.manifests[]?.platform.architecture] | contains(["amd64", "arm64"])' \
                <<<"$manifest" >/dev/null; then
              # Releases before arm64 was built carry amd64 alone, and copying
              # one forward would leave an ARM host nothing to pull.
              reason="$image:$previous lacks an amd64 or an arm64 image"
            else
              echo "$component: unchanged since $previous. Copying that image rather than building."
              docker buildx imagetools create \
                --tag "$image:$TAG" \
                --tag "$image:latest" \
                "$image:$previous"
              continue
            fi

            echo "$component: building, $reason."
            build+=("$component")
          done

          echo "build=$(jq -cn '$ARGS.positional' --args "${build[@]}")" >> "$GITHUB_OUTPUT"

  # One leg per image and architecture, each on a runner of that architecture.
  # Under QEMU every arm64 instruction is emulated: the shell image's npm
  # install alone took four minutes that way on a local build, and a node-gyp
  # fallback would take far longer. Native arm64 runners are free for public
  # repos. Each leg pushes its image by digest alone; the job below tags the
  # pair.
  build:
    name: Build ${{ matrix.component }} for ${{ matrix.arch }}
    needs: [plan]
    if: needs.plan.outputs.build != '[]'
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        component: ${{ fromJSON(needs.plan.outputs.build) }}
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/kasten-${{ matrix.component }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.component }}/Dockerfile
          platforms: linux/${{ matrix.arch }}
          # The backend writes this into its package version, so the image
          # reports the release it ships under.
          build-args: ${{ matrix.component == 'backend' && format('KASTEN_VERSION={0}', github.event.release.tag_name) || '' }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/kasten-${{ matrix.component }},push-by-digest=true,name-canonical=true,push=true
          # The amd64 leg keeps the cache scope the single-arch build used, so
          # the first release built this way starts warm.
          cache-from: type=gha,scope=${{ matrix.arch == 'amd64' && matrix.component || format('{0}-{1}', matrix.component, matrix.arch) }}
          cache-to: type=gha,scope=${{ matrix.arch == 'amd64' && matrix.component || format('{0}-{1}', matrix.component, matrix.arch) }},mode=max
      - name: Write the digest down for the job that tags it
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.component }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  images:
    name: Publish ${{ matrix.component }} image
    needs: [plan, build]
    if: needs.plan.outputs.build != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: ${{ fromJSON(needs.plan.outputs.build) }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-${{ matrix.component }}-*
          merge-multiple: true
          path: /tmp/digests
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/kasten-${{ matrix.component }}
          tags: |
            type=raw,value=${{ github.event.release.tag_name }}
            type=raw,value=latest
      # One index over both digests, under the same two tags a single-arch
      # build carried. A host pulls the tag and gets its own architecture, so
      # the amd64 VPS pulls what it always did.
      - name: Tag both architectures as one image
        working-directory: /tmp/digests
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/kasten-${{ matrix.component }}
          TAG: ${{ github.event.release.tag_name }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          tag_args=()
          while read -r tag; do
            if [ -n "$tag" ]; then tag_args+=(--tag "$tag"); fi
          done <<<"$TAGS"
          digests=()
          for digest in *; do
            digests+=("$IMAGE@sha256:$digest")
          done
          if [ "${#digests[@]}" -ne 2 ]; then
            echo "::error::Expected an amd64 and an arm64 digest, found ${#digests[@]}."
            exit 1
          fi
          docker buildx imagetools create "${tag_args[@]}" "${digests[@]}"
          docker buildx imagetools inspect "$IMAGE:$TAG"

  deploy:
    name: Deploy to VPS
    needs: [plan, build, images]
    # `always()` lets a workflow_dispatch redeploy run even though the skipped
    # jobs above would otherwise block it. A failed or cancelled job above
    # still stops the deploy. A skipped one does not; on a release `build`
    # and `images` always run, since the backend is built every time.
    if: always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    # Nothing of this repo runs on the VPS. The job sends the tag over SSH, and
    # a script that lives on the box, in server-infra, pulls the images of that
    # tag, runs the migrations, restarts the services from a compose file kept
    # there and waits for the backend to report healthy. The key can do nothing
    # else, and only main and release tags may use the environment that holds
    # it.
    environment: vps
    permissions: {}
    steps:
      - name: Send the tag to the VPS
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          install -m 600 /dev/null ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_SSH_KEY" >~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" >~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$DEPLOY_HOST" "$TAG"

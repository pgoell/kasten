# The weekly design review (#943): an agent reads the week's busiest area for
# its design, and a step files what it found as one issue. How the area is
# picked and how to act on the issue: docs/how-to/review-an-area-for-deep-modules.md.
name: Design review

on:
  # 03:15 Berlin is 01:15 UTC in summer and 02:15 UTC in winter. The first step
  # keeps the cron that matches today's Berlin offset, so a late start still runs.
  schedule:
    - cron: "15 1 * * 1"
    - cron: "15 2 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: design-review
  cancel-in-progress: false

jobs:
  design:
    name: Design review
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - id: hour
        env:
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
        run: |
          case "$(TZ=Europe/Berlin date +%z)" in +0200) want="15 1 * * 1" ;; *) want="15 2 * * 1" ;; esac
          if [ "$EVENT" = schedule ] && [ "$CRON" != "$want" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.hour.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The script and prompt run from outside the checkout, where the agent cannot change them.
      - id: pick
        if: steps.hour.outputs.run == 'true'
        run: |
          cp .github/review/design.py .github/review/design.md "$RUNNER_TEMP/"
          python3 "$RUNNER_TEMP/design.py" fetch > "$RUNNER_TEMP/data.json"
          python3 "$RUNNER_TEMP/design.py" pick --data "$RUNNER_TEMP/data.json" --json "$RUNNER_TEMP/area.json" > "$RUNNER_TEMP/pick.txt"
          area=$(jq -r '.area // empty' "$RUNNER_TEMP/area.json")
          echo "area=$area" >> "$GITHUB_OUTPUT"
          if [ -z "$area" ]; then
            cat "$RUNNER_TEMP/pick.txt" >> "$GITHUB_STEP_SUMMARY"
          else
            { echo '```'; cat "$RUNNER_TEMP/pick.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
      # Claude Code's sandbox needs bubblewrap and socat, and user namespaces,
      # which Ubuntu's AppArmor blocks by default (as in ci.yml's review job).
      - if: steps.pick.outputs.area != ''
        run: |
          sudo apt-get install -y -qq bubblewrap socat
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - id: prompt
        if: steps.pick.outputs.area != ''
        run: |
          mkdir -p .review
          python3 "$RUNNER_TEMP/design.py" context --data "$RUNNER_TEMP/data.json" > .review/past.md
          {
            echo 'text<<PROMPT_END'
            python3 "$RUNNER_TEMP/design.py" prompt --area-json "$RUNNER_TEMP/area.json"
            echo 'PROMPT_END'
          } >> "$GITHUB_OUTPUT"
      - if: steps.pick.outputs.area != ''
        uses: anthropics/claude-code-action@d70510b174a1244958df0b03166a54912811f3e6 # v1.0.264
        env:
          # Strips the tokens from the environment of every command it runs; the
          # action writes one into .git/config, so the agent may not read .git.
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: 1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: ${{ steps.prompt.outputs.text }}
          claude_args: >-
            --model claude-opus-5-5
            --disallowedTools "Read(./.git/**)"
            --allowedTools "Read(./**),Write(./.review/findings.md),Edit(./.review/findings.md),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git grep:*),Bash(git ls-files:*)"
      - if: steps.pick.outputs.area != ''
        env:
          AREA: ${{ steps.pick.outputs.area }}
        run: |
          python3 "$RUNNER_TEMP/design.py" file --data "$RUNNER_TEMP/data.json" --findings .review/findings.md --area-json "$RUNNER_TEMP/area.json" > "$RUNNER_TEMP/issue.md"
          if [ -s "$RUNNER_TEMP/issue.md" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "refactor(review): design review of $AREA" \
              --label refactor,not-for-loop,review:design \
              --body-file "$RUNNER_TEMP/issue.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No finding in $AREA worth filing, so no issue." >> "$GITHUB_STEP_SUMMARY"
          fi

# mise.toml — toolchain pins and task definitions

[tools]
python = "3.14"
# The chat runner in `shell/chat` runs on the shell image's node, so its tests
# run on the same major here. Nothing else in the repo runs on node: the
# frontend is bun's.
node   = "24"
uv     = "latest"
bun    = "1.3.8"
"ubi:evilmartians/lefthook" = "1.11.14"
# The backend shells out to jj to record vault writes. Pinned rather than
# "latest" because the same version has to be in the backend image: host and
# container share one repo through the bind mount.
"ubi:jj-vcs/jj" = "0.37.0"
# And to rg to answer `GET /api/search`. Unlike jj this one is not optional:
# without it there is no search at all, so it is pinned beside the tests that
# depend on it.
"aqua:BurntSushi/ripgrep" = "14.1.1"

# ─── Bootstrap ──────────────────────────────────────────────────────────────

[tasks.install]
description = "Bootstrap dev environment (git hooks + backend + frontend deps)"
depends = ["fe:install"]
run = [
  "lefthook install",
  "uv sync",
]

# ─── Dev loop ───────────────────────────────────────────────────────────────

[tasks.dev]
description = "Run the backend with auto-reload on :8000"
# `--timeout-graceful-shutdown`: `/api/events` runs until its reader leaves and
# uvicorn waits for open connections before it stops, so a browser tab holding
# that stream would pin the old process open on every reload. See compose.dev.yml.
run = "uv run uvicorn kasten_backend.main:app --reload --timeout-graceful-shutdown 1 --port 8000"

[tasks."fe:dev"]
description = "Run the frontend dev server on :5173"
dir = "{{config_root}}/frontend"
run = "bun run dev"

# ─── Hosted dev environment ─────────────────────────────────────────────────
# Reload servers in containers with the working tree bind-mounted, reached
# through Caddy at kasten-dev.pgoell.com. Editing a file reloads the
# running service. Nothing about dev goes through GitHub Actions; production is
# the opposite, images only, built in CI. See docs/explanation/environments.md.

[tasks."dev:up"]
description = "Start the hosted dev environment (db + reload servers)"
# The mkdir matters: these are bind mounts, and Docker would otherwise create
# them as root, leaving the non-root containers unable to write.
#
# The binary copies matter for the same kind of reason: the dev backend runs
# the stock uv image, which has neither jj nor rg in it, and the backend shells
# out to jj on every save and to rg on every search. Both release builds are
# static musl, so mise's copies run in the container as they do on the host.
# Production is the other path entirely, and installs both in backend/Dockerfile.
#
# `--build` is for shell-dev, the one dev service built from a Dockerfile.
# Without it a Dockerfile edit stays invisible until the image is deleted by
# hand. The other two run stock images and rebuild nothing.
run = [
  "mkdir -p .container/venv .container/node_modules .container/bin vault",
  "cp -f \"$(mise which jj)\" .container/bin/jj",
  "cp -f \"$(mise which rg)\" .container/bin/rg",
  "docker compose -f compose.yaml -f compose.dev.yml up -d --build",
]

[tasks."dev:down"]
description = "Stop the hosted dev environment (keeps the db volume)"
run = "docker compose -f compose.yaml -f compose.dev.yml down"

[tasks."dev:restart"]
description = "Restart the dev reload servers (after a uv.lock change; bun.lock installs by itself)"
run = "docker compose -f compose.yaml -f compose.dev.yml restart backend-dev frontend-dev"

[tasks."dev:status"]
description = "Show hosted dev container status"
run = "docker compose -f compose.yaml -f compose.dev.yml ps"

[tasks."dev:logs"]
description = "Follow the dev reload server logs"
run = "docker compose -f compose.yaml -f compose.dev.yml logs -f backend-dev frontend-dev"

# ─── Database ───────────────────────────────────────────────────────────────

[tasks."db:up"]
description = "Start the dev Postgres"
run = "docker compose up -d db"

[tasks."db:stop"]
description = "Stop the dev DB (keeps the volume)"
run = "docker compose stop db"

[tasks."db:reset"]
description = "Destroy the dev DB volume and start fresh (DANGEROUS)"
run = [
  "docker compose rm -sf db",
  # `|| true` — `volume rm` exits non-zero when the volume is already gone,
  # which happens on fresh clones. Swallow it so this task is idempotent.
  "docker volume rm kasten_pgdata || true",
  "docker compose up -d db",
]

[tasks."db:migrate"]
description = "Apply migrations to the dev DB"
dir = "{{config_root}}/backend"
run = "uv run alembic upgrade head"

[tasks."db:revision"]
description = "Autogenerate a migration (usage: mise run db:revision -- -m 'message')"
dir = "{{config_root}}/backend"
run = "uv run alembic revision --autogenerate"

[tasks."db:downgrade"]
description = "Roll back the last migration"
dir = "{{config_root}}/backend"
run = "uv run alembic downgrade -1"

# ─── Testing ────────────────────────────────────────────────────────────────

[tasks.test]
description = "Run all tests (backend + frontend)"
depends = ["test:py", "fe:test", "shell:test"]

[tasks."test:py"]
description = "Run backend tests"
run = "uv run pytest"

[tasks."fe:test"]
description = "Run frontend tests"
run = "bun run --cwd frontend test"

[tasks."shell:test"]
description = "Run the chat runner's tests"
# node's own runner, and a glob rather than the directory: handed a directory,
# `node --test` tries to run it as a module.
run = "node --test 'shell/chat/*.test.mjs'"

[tasks."chat:stub"]
description = "Run the chat runner with a scripted session on :7682, no login"
# What `fe:dev` proxies `/chat` to, so the chat pane can be worked on without
# the shell container or a Claude login.
run = "node shell/chat/stub.mjs"

# ─── Vault maintenance ──────────────────────────────────────────────────────

[tasks."okf:backfill"]
description = "Write `type` into every note in the vault that has none"
# The vault is an argument rather than a setting, so the one CLI reaches any
# vault. The default is written relative to `backend/` because `dir` sets it.
dir = "{{config_root}}/backend"
run = "uv run python -m kasten_backend.okf ../vault"

[tasks."index:backfill"]
description = "Write an index.md into every folder in the vault that has none"
# Never run at startup, unlike the type pass: a folder whose index you deleted
# would get it back on every boot.
dir = "{{config_root}}/backend"
run = "uv run python -m kasten_backend.indexes ../vault"

# ─── GitHub repo config ─────────────────────────────────────────────────────

[tasks."repo:apply-settings"]
description = "Apply GitHub repo + branch-protection settings from .github/*.json, turn on Dependabot security updates"
run = "bash scripts/apply-github-settings.sh"

[tasks."repo:check-settings"]
description = "Diff live branch protection against .github/branch-protection.json, check security settings"
run = "bash scripts/apply-github-settings.sh --check"

# ─── Lint & format ──────────────────────────────────────────────────────────

[tasks.lint]
description = "Run the fast linters, both type checkers and the file-size check (pre-commit gate)"
# `fe:typecheck` is in here rather than left to CI because the two halves of the
# repo have to be gated alike: `lint:py` type-checks the backend, and without
# this the frontend was the half where a type error reached the branch. It
# brings `fe:build` with it, which is what emits the gitignored route tree, and
# the pair costs about two seconds.
depends = ["lint:py", "lint:size", "fe:lint", "fe:typecheck", "shell:lint"]

[tasks."lint:py"]
description = "Lint, format-check and type-check the backend"
run = [
  "uv run ruff check",
  "uv run ruff format --check",
  "uv run ty check",
]

[tasks."lint:size"]
description = "Check every tracked file against the 5,000-token limit"
# No arguments, so every tracked file is checked, not only the staged ones. The
# cap and its reason are in docs/explanation/file-size-limit.md.
run = "python3 scripts/file_size.py"

[tasks.fmt]
description = "Auto-format everything"
depends = ["fe:fmt"]
run = "uv run ruff format"

# ─── Frontend ───────────────────────────────────────────────────────────────

[tasks."fe:install"]
description = "Install frontend dependencies"
run = "bun install --cwd frontend"

[tasks."fe:build"]
description = "Build the frontend for production"
dir = "{{config_root}}/frontend"
# `--logLevel warn` drops the per-chunk size table, which is 150 lines nobody
# reads and which `lint` would print on every commit. The warnings survive.
run = "bun run build --logLevel warn"

[tasks."fe:lint"]
description = "Lint the frontend (Biome)"
run = "bun run --cwd frontend lint"

[tasks."shell:lint"]
description = "Lint the chat runner (Biome)"
# The frontend's Biome and the frontend's rules, pointed at the one other
# directory of JavaScript in the repo, rather than a second install and a
# second config for five files.
run = "frontend/node_modules/.bin/biome check --config-path frontend shell/chat"

[tasks."fe:fmt"]
description = "Format the frontend (Biome)"
run = "bun run --cwd frontend fmt"

[tasks."fe:typecheck"]
description = "Type-check the frontend with tsc --noEmit"
# Depends on the build because the TanStack Router plugin emits the gitignored
# routeTree.gen.ts, which tsc needs to resolve the route graph.
depends = ["fe:build"]
run = "bun run --cwd frontend typecheck"

[tasks."fe:bench"]
description = "Record the frontend benchmark numbers on this machine (gates nothing)"
run = "bun run --cwd frontend vitest bench --run --project perf"

[tasks."fe:frame"]
description = "Run the end-to-end frame tests in Chromium (needs a browser install)"
run = "bun run --cwd frontend vitest run --project frame"

[tasks."fe:e2e"]
description = "Prove offline capture in Chromium against the production build (needs a browser install)"
# The service worker exists only in the build, so the proof runs against dist.
depends = ["fe:build"]
run = "bun frontend/e2e/offline.ts"

[tasks."fe:e2e:release"]
description = "Prove a tab open across a release survives it, in Chromium against two builds (needs a browser install)"
dir = "{{config_root}}/frontend"
# Release N as `fe:build` makes it, and N+1 with every asset renamed.
run = [
  "bunx vite build --logLevel warn --outDir dist-e2e-a --emptyOutDir",
  "bunx vite build --logLevel warn --config e2e/release-b.config.ts --outDir dist-e2e-b --emptyOutDir",
  "bun e2e/release.ts",
]

[tasks."fe:types"]
description = "Regenerate the OpenAPI-derived types for the frontend"
run = "bash scripts/gen_frontend_types.sh"

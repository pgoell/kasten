<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover draws the page under the notch and the home
         indicator, and is what makes Safari answer env(safe-area-inset-*) with
         anything but zero. The frame and the bars pad themselves clear by
         those insets (#355). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content, viewport-fit=cover" />
    <!-- Right after the meta and not deferred: it takes cover back off on
         Android before the first layout (#364). -->
    <script src="/viewport-fit.js"></script>
    <!-- The browser bar's colour, which theme.js sets per theme, so it has to be
         parsed before the script runs. -->
    <meta name="theme-color" content="#f6f6f4" />
    <!-- Beside the viewport script, for the same reason: data-theme has to be
         set before the first paint, or a dark reader sees a light flash (I2). -->
    <script src="/theme.js"></script>
    <!-- The loading screen until React replaces #root, inline so it paints at
         once. Its colours copy kasten-theme.css; tests/theme.test.ts holds them. -->
    <style>
      html { --boot-bg: #f6f6f4; --boot-ink: #1c1c1b; --boot-accent: #316f90; background: var(--boot-bg); }
      html[data-theme="dark"] { --boot-bg: #141414; --boot-ink: #e8e7e4; --boot-accent: #82b9d9; }
      html[data-palette="russet"] { --boot-accent: #9a5143; }
      html[data-palette="russet"][data-theme="dark"] { --boot-accent: #e59c8d; }
      html[data-palette="peach"] { --boot-accent: #b93100; }
      html[data-palette="peach"][data-theme="dark"] { --boot-accent: #fd8e70; }
      html[data-palette="pansy"] { --boot-accent: #a83f5d; }
      html[data-palette="pansy"][data-theme="dark"] { --boot-accent: #f48da5; }
      .boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding-bottom: 40px; background: var(--boot-bg); }
      .boot .a { stroke: var(--boot-accent); }
      .boot .i { fill: var(--boot-ink); }
      .boot-mark { width: 112px; height: 112px; }
      .boot-word { height: 44px; }
      .boot-bar { position: absolute; bottom: calc(92px + env(safe-area-inset-bottom)); width: 120px; height: 3px; border-radius: 2px; overflow: hidden; background: color-mix(in srgb, var(--boot-ink) 10%, transparent); }
      .boot-bar::after { content: ""; display: block; width: 40%; height: 100%; border-radius: 2px; background: var(--boot-accent); animation: boot-slide 1.2s cubic-bezier(0.23, 1, 0.32, 1) infinite; }
      @keyframes boot-slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { .boot-bar::after { animation: none; transform: translateX(75%); } }
    </style>
    <title>kasten</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- use-credentials, because the whole site sits behind oauth2-proxy and a
         manifest is fetched without cookies by default: it would get the
         sign-in redirect instead of the JSON. -->
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <!-- Safari reads the manifest for how the app opens, and these tags for
         the home screen icon, which it takes from no manifest, and for the
         status bar. The capable tag has two names: the first is the one Chrome
         asks for, the second the one an older Safari needs. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="kasten" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <link rel="apple-touch-icon" href="/icons/app-maskable-512.png" />
  </head>

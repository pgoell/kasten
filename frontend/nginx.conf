server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed asset filenames, so cache them hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # What pdf.js reads beside the bundle, staged here by the `foliatePdfjs`
    # plugin in vite.config.ts: a module worker, two stylesheets, and the
    # character maps and standard fonts a document may ask for.
    #
    # `default_type` because nginx's own mime.types has no row for `.mjs`, so
    # the worker would go out as `application/octet-stream` and Chrome refuses a
    # module worker whose type is not javascript. The default answers only the
    # extensions the table misses, which here is `.mjs`, `.bcmap` and `.pfb`;
    # the last two are read as bytes and do not care what they are called. `.css`
    # is in the table and still goes out as `text/css`.
    #
    # A location of its own rather than a rule inside `/`, so a cmap the vendor
    # drop is missing answers 404 instead of the SPA shell, which pdf.js would
    # try to parse as a font.
    location /pdfjs/ {
        default_type text/javascript;
    }

    # Client-side routing: unknown paths fall through to the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;

        # On the block that serves index.html, because that is the document the
        # policy has to reach. Not left to inheritance: one add_header in a
        # block switches off every inherited one, which is what `location
        # /assets/` above does to itself. The copy in src/lib/csp.ts is the
        # other half, and tests/csp.test.ts fails when they disagree.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' blob:; img-src 'self' data: blob:; font-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; frame-src blob: https://www.youtube.com; object-src blob:; base-uri 'none'; form-action 'none'";
    }
}

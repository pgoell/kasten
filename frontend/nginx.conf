server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed asset filenames, so cache them hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routing: unknown paths fall through to the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;

        # On the block that serves index.html, because that is the document the
        # policy has to reach. Not left to inheritance: one add_header in a
        # block switches off every inherited one, which is what `location
        # /assets/` above does to itself. The copy in src/lib/csp.ts is the
        # other half, and tests/csp.test.ts fails when they disagree.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' blob:; img-src 'self' data: blob:; font-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; frame-src blob:; object-src blob:; base-uri 'none'; form-action 'none'";
    }
}

server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed asset filenames, so cache them hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routing: unknown paths fall through to the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Git hooks. Installed by `mise run install`.
#
# pre-commit stays fast (lint, format and the file-size check). Anything slow
# enough to make you reach for --no-verify belongs in pre-push instead.

pre-commit:
  commands:
    lint:
      run: mise run lint
    # Staged files only: 37 files are still over the limit, so a commit fails
    # only when it stages one of them, and the task that touches it splits it
    # (#611). With nothing staged lefthook skips the command, which keeps the
    # script's no-argument mode, every tracked file, out of the hook.
    file-size:
      run: python3 scripts/file_size.py {staged_files}

pre-push:
  commands:
    test:
      run: mise run test
    typecheck-frontend:
      run: mise run fe:typecheck

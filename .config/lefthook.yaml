# Git hooks. Installed by `mise run install`.
#
# pre-commit stays fast (lint, format, the file-size, fan-out and copy checks). Anything slow
# enough to make you reach for --no-verify belongs in pre-push instead.

pre-commit:
  commands:
    lint:
      run: mise run lint
    # The staged-files checks. `mise run lint` above sizes what HEAD holds, so
    # these are the ones that see what this commit adds. With nothing staged
    # lefthook skips them.
    file-size:
      run: scripts/structure/check-file-size {staged_files}
    fan-out:
      run: scripts/structure/check-fan-out {staged_files}

pre-push:
  commands:
    test:
      run: mise run test
    typecheck-frontend:
      run: mise run fe:typecheck

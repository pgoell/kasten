# Git hooks. Installed by `mise run install`.
#
# pre-commit stays fast (lint, format and the file-size check). Anything slow
# enough to make you reach for --no-verify belongs in pre-push instead.

pre-commit:
  commands:
    lint:
      run: mise run lint
    # Staged files only, so a commit fails fast when it stages a file over the
    # limit, new or old. `mise run lint` above checks every tracked file. With
    # nothing staged lefthook skips this command.
    file-size:
      run: python3 scripts/file_size.py {staged_files}

pre-push:
  commands:
    test:
      run: mise run test
    typecheck-frontend:
      run: mise run fe:typecheck

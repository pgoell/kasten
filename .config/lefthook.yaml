# Git hooks. Installed by `mise run install`.
#
# pre-commit stays fast (lint, format, the file-size and the copy check). Anything slow
# enough to make you reach for --no-verify belongs in pre-push instead.

pre-commit:
  commands:
    lint:
      run: mise run lint
    # The narrower staged-files check. It predates the whole-repo one in
    # `mise run lint` above, and stays so a staged file over the limit is named
    # on its own. With nothing staged lefthook skips this command.
    file-size:
      run: python3 scripts/file_size.py {staged_files}

pre-push:
  commands:
    test:
      run: mise run test
    typecheck-frontend:
      run: mise run fe:typecheck

# Root pyproject.toml — declares the uv workspace and shared tool config.
# This is NOT a publishable package; it has no [project] section.

[tool.uv.workspace]
members = ["backend", "jobs"]

# ─── Shared Python tool config ──────────────────────────────────────────────

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope   = "function"
testpaths = ["backend/tests", "jobs/tests"]
# `importlib` avoids the classic pytest trap where two test dirs that both
# contain `__init__.py` collide under the same `tests` package name.
addopts   = ["--import-mode=importlib"]

[tool.ruff]
target-version = "py314"
line-length    = 100
extend-exclude = ["backend/alembic/script.py.mako"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "C4",       # comprehensions
    "UP",       # pyupgrade
    "SIM",      # simplify
    "RUF",      # ruff-specific
    "N",        # pep8-naming
    "PTH",      # pathlib over os.path
    "PIE",      # misc anti-patterns
    "RET",      # return statement hygiene
    "TID",      # tidy imports
    "TC",       # type-checking import grouping
    "S",        # bandit (security)
    "ASYNC",    # async best practices
    "ERA",      # eradicate commented-out code
    "PL",       # pylint subset
    "D",        # pydocstyle (docstring enforcement)
    "C90",      # mccabe complexity
    "PLR0911",  # too many returns
    "PLR0912",  # too many branches
    "PLR0913",  # too many arguments
    "PLR0915",  # too many statements
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = [
    "S101",     # assert is the point of a test
    "PLR2004",  # magic values are fine in test fixtures
    "D",        # docstrings not required in test files
]
"**/alembic/**" = [
    "D",        # docstrings not required in generated migration files
    "E501",     # long lines unavoidable in autogenerated constraint names
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.flake8-tidy-imports]
# The default, "parents", bans `from ..x` but lets `from .x` through, and every
# relative import kasten had was the sibling kind. Imports name the package.
ban-relative-imports = "all"

# Dynamic imports hide what a module needs from the import graph and from ruff, so each
# form is banned; test_food.py and test_dump_openapi.py carry the two accepted ones (#718).
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"importlib.import_module" = { msg = "import the module at the top of the file; see .claude/CLAUDE.md, No dynamic imports" }
"importlib.reload" = { msg = "import the module at the top of the file; see .claude/CLAUDE.md, No dynamic imports" }
"importlib.__import__" = { msg = "import the module at the top of the file; see .claude/CLAUDE.md, No dynamic imports" }
"importlib.util.spec_from_file_location" = { msg = "import the module at the top of the file; see .claude/CLAUDE.md, No dynamic imports" }
"importlib.util.module_from_spec" = { msg = "import the module at the top of the file; see .claude/CLAUDE.md, No dynamic imports" }
runpy = { msg = "import the module at the top of the file; see .claude/CLAUDE.md, No dynamic imports" }
"importlib.util.find_spec" = { msg = "import the module at the top of the file; see .claude/CLAUDE.md, No dynamic imports" }
"importlib.machinery" = { msg = "import the module at the top of the file; see .claude/CLAUDE.md, No dynamic imports" }
pkgutil = { msg = "import the module at the top of the file; see .claude/CLAUDE.md, No dynamic imports" }

[tool.ruff.lint.isort]
known-first-party = ["kasten_backend", "kasten_jobs"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.environment]
python-version  = "3.14"
python-platform = "linux"
root            = ["."]

[tool.ty.src]
respect-ignore-files = true

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1",
    "import-linter>=2.15",
    "pytest>=9.0",
    "pytest-asyncio>=1.3",
    "pytest-xdist>=3.8",
    "ruff>=0.15",
    "ty>=0.0.28",
]

# Each contract's name is what lint-imports prints on failure, so it states the rule and the fix.
# The ignore_imports are today's breaches (#718); a new one fails, and so does a stale one.
[tool.importlinter]
root_packages = ["kasten_backend", "kasten_jobs"]

[[tool.importlinter.contracts]]
name = "Jobs never import the backend: call its HTTP API instead"
type = "independence"
modules = ["kasten_backend", "kasten_jobs"]

[[tool.importlinter.contracts]]
name = "Only main mounts routers: move shared models and helpers out of routes into a non-route module"
type = "protected"
protected_modules = ["kasten_backend.routes"]
allowed_importers = ["kasten_backend.main"]
ignore_imports = [
    "kasten_backend.agent_finance -> kasten_backend.routes.finance",  # today's breach, to fix later; #718
    "kasten_backend.agent_finance -> kasten_backend.routes.finance_plans",  # today's breach, to fix later; #718
    "kasten_backend.agent_finance -> kasten_backend.routes.finance_sorting",  # today's breach, to fix later; #718
    "kasten_backend.agent_finance_routes -> kasten_backend.routes.finance",  # today's breach, to fix later; #718
    "kasten_backend.agent_finance_routes -> kasten_backend.routes.finance_budget",  # today's breach, to fix later; #718
    "kasten_backend.agent_finance_routes -> kasten_backend.routes.finance_drill",  # today's breach, to fix later; #718
    "kasten_backend.agent_finance_routes -> kasten_backend.routes.finance_goals",  # today's breach, to fix later; #718
    "kasten_backend.agent_finance_routes -> kasten_backend.routes.finance_plans",  # today's breach, to fix later; #718
    "kasten_backend.agent_finance_routes -> kasten_backend.routes.finance_sync",  # today's breach, to fix later; #718
    "kasten_backend.agent_finance_routes -> kasten_backend.routes.finance_tax",  # today's breach, to fix later; #718
    "kasten_backend.agent_mcp_finance -> kasten_backend.routes.finance_budget",  # today's breach, to fix later; #718
    "kasten_backend.agent_mcp_finance -> kasten_backend.routes.finance_drill",  # today's breach, to fix later; #718
    "kasten_backend.agent_mcp_finance -> kasten_backend.routes.finance_goals",  # today's breach, to fix later; #718
    "kasten_backend.agent_mcp_finance -> kasten_backend.routes.finance_plans",  # today's breach, to fix later; #718
    "kasten_backend.agent_mcp_finance -> kasten_backend.routes.finance_sync",  # today's breach, to fix later; #718
    "kasten_backend.agent_mcp_finance -> kasten_backend.routes.finance_tax",  # today's breach, to fix later; #718
]

[[tool.importlinter.contracts]]
name = "Nothing imports main: move the shared code out of the app entry point"
type = "protected"
protected_modules = ["kasten_backend.main"]
allowed_importers = ["kasten_backend.main"]

[[tool.importlinter.contracts]]
name = "No import cycles between sibling modules: move the shared part into a module both import"
type = "acyclic_siblings"
ancestors = ["kasten_backend", "kasten_jobs"]
ignore_imports = [
    "kasten_backend.model_use_sessions -> kasten_backend.model_use_codex",  # today's breach, to fix later; #718
    "kasten_backend.model_use_sessions -> kasten_backend.model_use_grok",  # today's breach, to fix later; #718
]

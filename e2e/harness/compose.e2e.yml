# Laid over compose.yaml by e2e/harness/global-setup.ts, with a fresh project
# name per run. Port 0 lets Docker pick a free host port; the data lives on a
# tmpfs, so the dev volume kasten_pgdata is never mounted, let alone removed.
services:
  db:
    ports: !override
      - "127.0.0.1:0:5432"
    volumes: !reset []
    tmpfs:
      - /var/lib/postgresql/data
  # The image and config frontend/Dockerfile ships, over this checkout's build.
  web:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:0:3000"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes: !reset {}

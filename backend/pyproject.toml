[project]
name = "kasten-backend"
version = "0.1.0"
description = "kasten HTTP backend (FastAPI) over a markdown vault"
authors = [
    { name = "pgoell", email = "pascal98kraus@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.14",
    "fastapi[standard]>=0.135",
    "markdown-it-py>=3.0",
    "psycopg[binary]>=3.3",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0.35",
    "watchfiles>=1.0",
]

[build-system]
requires = ["uv_build>=0.9,<0.12.0"]
build-backend = "uv_build"

[project]
name = "kasten-backend"
# The number the next release carries, and the only place it is written. The
# deploy workflow refuses a release whose tag says something else. See
# docs/how-to/cut-a-release.md.
version = "0.21.0"
description = "kasten HTTP backend (FastAPI) over a markdown vault"
authors = [
    { name = "pgoell", email = "pascal98kraus@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.14",
    "fastapi[standard]>=0.135",
    # Reached for directly by `/api/fetch`, and not only through the test
    # client fastapi's standard extra brings it in for.
    "httpx>=0.28",
    "markdown-it-py>=3.0",
    # Pinned exactly, not floored. There is no dependabot or renovate in
    # `.github/`, so a bump is something a person does on purpose; the pin plus
    # the round-trip test in `test_mcp.py` is what turns one into a CI answer
    # rather than a production discovery. The SDK renamed its server class
    # between major versions and moved the option names with it.
    "mcp==2.0.0",
    "psycopg[binary]>=3.3",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0.35",
    "watchfiles>=1.0",
]

[build-system]
requires = ["uv_build>=0.9,<0.12.0"]
build-backend = "uv_build"

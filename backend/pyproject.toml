[project]
name = "kasten-backend"
# A placeholder that is never bumped. The release number is the git tag, and the
# backend image build writes it in (KASTEN_VERSION in backend/Dockerfile). Dev
# and the tests report this 0.0.0. See docs/how-to/cut-a-release.md.
version = "0.0.0"
description = "kasten HTTP backend (FastAPI) over a markdown vault"
license = "AGPL-3.0-only"
authors = [
    { name = "pgoell", email = "pascal98kraus@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "curl-cffi==0.17.0",
    "fastapi[standard]>=0.162.0",
    # Reached for directly by `/api/fetch`, and not only through the test
    # client fastapi's standard extra brings it in for.
    "httpcore>=1.0",
    "httpx>=0.28",
    "justhtml==3.16.0",
    "markdown-it-py>=3.0",
    # Pinned exactly, so a bump is its own pull request, where `test_mcp.py`'s
    # round trip catches the SDK's renames before production does.
    "mcp==2.2.0",
    "numpy>=2.3",
    "onnxruntime>=1.23",
    "pgvector>=0.4",
    "psycopg[binary]>=3.3.8",
    "pydantic-settings>=2.7",
    "pypdfium2>=4.30",
    "recipe-scrapers==15.13.0",
    "sqlalchemy[asyncio]>=2.1.8",
    "tokenizers>=0.22",
    "watchfiles>=1.0",
    "youtube-transcript-api>=1.2",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
